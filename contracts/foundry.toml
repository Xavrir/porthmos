[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[invariant]
runs = 64
depth = 40
fail_on_revert = false

[fuzz]
runs = 256

[lint]
lint_on_build = false
