<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="act7-template">
      <style>
        #act7-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #act7-root .a7-scrim {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 1700px;
          height: 900px;
          margin-left: -850px;
          margin-top: -450px;
          background: radial-gradient(closest-side, rgba(1, 6, 4, 0.92), rgba(1, 6, 4, 0.75) 55%, rgba(1, 6, 4, 0));
        }
        #act7-root .beat {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          opacity: 0;
        }
        #act7-root .num {
          font-family: var(--sans);
          font-optical-sizing: auto;
          font-size: 320px;
          font-weight: 900;
          letter-spacing: -0.06em;
          line-height: 0.9;
          color: var(--ink);
          text-shadow: 0 0 80px rgba(78, 195, 151, 0.35);
          font-variant-numeric: tabular-nums;
        }
        #act7-root .zero {
          color: var(--green);
          text-shadow: 0 0 90px rgba(78, 195, 151, 0.6);
        }
        #act7-root .what {
          font-family: var(--sans);
          font-optical-sizing: auto;
          font-size: 56px;
          font-weight: 760;
          letter-spacing: -0.025em;
          color: var(--ink);
          text-align: center;
        }
        #act7-root .what span {
          color: var(--muted);
          font-weight: 600;
        }
        #act7-root .parts {
          margin-top: 18px;
          display: flex;
          gap: 14px;
        }
        #act7-root .parts .chip {
          font-size: 30px;
          padding: 14px 26px;
        }
        #act7-root .parts .chip b {
          color: var(--green);
          font-weight: 700;
        }
        #act7-next {
          margin-top: 34px;
          font-family: var(--mono);
          font-size: 38px;
          letter-spacing: 0.04em;
          color: var(--muted);
          opacity: 0;
        }
        #act7-next b {
          color: var(--green);
          font-weight: 600;
        }
      </style>
      <div id="act7-root" data-composition-id="act7" data-width="1920" data-height="1080" data-duration="16">
        <div class="a7-scrim"></div>
        <div class="beat" id="act7-b1">
          <div class="num" id="act7-n9">9</div>
          <div class="what">contracts on Base Sepolia</div>
        </div>
        <div class="beat" id="act7-b2">
          <div class="num" id="act7-n15">15</div>
          <div class="what">recorded scenarios. <span>Every one on BaseScan.</span></div>
        </div>
        <div class="beat" id="act7-b3">
          <div class="num" id="act7-ntests">0</div>
          <div class="what">automated tests</div>
          <div class="parts">
            <div class="chip"><b id="act7-tc"></b>&nbsp;contract</div>
            <div class="chip"><b id="act7-ts"></b>&nbsp;service</div>
            <div class="chip"><b id="act7-ti"></b>&nbsp;integration</div>
            <div class="chip"><b id="act7-tw"></b>&nbsp;web</div>
          </div>
        </div>
        <div class="beat" id="act7-b4">
          <div class="num zero">0</div>
          <div class="what">ways for the agent to send money out</div>
          <div id="act7-next"><b>Next:</b> audit, real vaults, a bank pilot</div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const $ = (id) => document.getElementById(id);
          const beats = ["act7-b1", "act7-b2", "act7-b3", "act7-b4"].map($);
          const at = [0, 3, 6.5, 11];

          beats.forEach((b, i) => {
            tl.set(b, { opacity: 1 }, at[i]);
            if (i < beats.length - 1) tl.set(b, { opacity: 0 }, at[i + 1]);
            tl.fromTo(b.querySelector(".num"), { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" }, at[i]);
            tl.fromTo(b.querySelector(".what"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at[i] + 0.18);
          });
          const facts = window.PORTHMOS_FACTS;
          $("act7-n9").textContent = String(facts.deployedContracts);
          $("act7-tc").textContent = facts.tests.contract;
          $("act7-ts").textContent = facts.tests.service;
          $("act7-ti").textContent = facts.tests.integration;
          $("act7-tw").textContent = facts.tests.web;
          FX.count(tl, $("act7-n15"), facts.recordedScenarios, 3.0, 0.5, (x) => String(Math.round(x)));
          FX.count(tl, $("act7-ntests"), facts.tests.total, 6.5, 0.7, (x) => String(Math.round(x)));
          tl.fromTo("#act7-b3 .parts .chip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.12, ease: "power2.out" }, 7.0);
          tl.fromTo($("act7-next"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 12.0);

          window.__timelines["act7"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
